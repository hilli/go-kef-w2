name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "**"

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
      - name: Extract release notes from CHANGELOG.md
        run: |
          # Strip 'v' prefix from tag to match CHANGELOG format
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Extracting release notes for version: $VERSION"
          
          # Extract section for this version (from ## [x.y.z] to next ## [ or EOF)
          # Skip the first line (version header) since GitHub shows the tag separately
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($2 == "[" ver "]") { found=1; next }
            }
            found {
              if (!started && $0 ~ /^[[:space:]]*$/) next
              started=1
              print
            }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          
          # Check if we found anything
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::Missing or empty CHANGELOG.md entry for version $VERSION"
            exit 1
          fi
          
          echo "--- Release notes ---"
          cat "$RUNNER_TEMP/release-notes.md"
          echo "--- End release notes ---"
      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          MASTODON_CLIENT_ID: ${{ secrets.MASTODON_CLIENT_ID }}
          MASTODON_CLIENT_SECRET: ${{ secrets.MASTODON_CLIENT_SECRET }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      - name: Verify published release notes
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body' > "$RUNNER_TEMP/published-release-notes.md"
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          expected = (root / "release-notes.md").read_text().strip()
          published = (root / "published-release-notes.md").read_text().strip()
          if not expected or expected not in published:
              raise SystemExit("::error::Published release notes do not contain the expected changelog entry")
          PY
